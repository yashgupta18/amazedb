services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amazedb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: amazedb
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/web/src/server/migration.sql:/docker-entrypoint-initdb.d/001-control-plane.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U amazedb -d amazedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./apps/web
    environment:
      DATABASE_URL: postgresql://amazedb:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/amazedb
      APP_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
